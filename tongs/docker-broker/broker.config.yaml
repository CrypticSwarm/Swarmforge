# Illustrative: replace these with the narrow, task-shaped verbs your project
# needs and pin image digests. `allowed_images` is the broker's entire allowlist.
name: docker-broker
description: >-
  Reference Swarmforge broker. Spawns short-lived worker containers on demand so
  the anvil can compile and test without holding the docker socket itself.

allowed_images:
  - node:24-alpine

commands:
  - name: build
    description: Run `npm run build` against the project workspace.
    image: node:24-alpine
    mounts: [workspace:/work]
    workdir: /work
    command: [npm, run, build]
    resources:
      memory: 1g
    params:
      - name: production
        type: boolean
        description: Build in production mode (sets NODE_ENV=production).
        when_true:
          env:
            NODE_ENV: production

  - name: test
    description: Run the project's test suite, optionally narrowed to one suite.
    image: node:24-alpine
    mounts: [workspace:/work:ro]
    workdir: /work
    command: [npm, test, --]
    params:
      - name: suite
        type: enum
        description: Which test suite to run; omit to run them all.
        values: [unit, integration, e2e]
        append_value: true
