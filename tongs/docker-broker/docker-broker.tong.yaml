# Deliberately NOT auto-discovered: discovery only reads top-level *.yaml in a
# layer's tongs/ directory, and this lives a level down, so shipping it in the
# checkout does not hand every repo a docker-socket broker.
#
# To enable:
#   1. make build_broker
#   2. cp tongs/docker-broker/docker-broker.tong.yaml ~/.swarmforge/tongs/docker-broker.yaml
#
# A workspace-sourced copy is always called out in the first-run approval prompt.
description: Spawns narrow docker-task workers on demand so the anvil never holds the docker socket itself.
lifecycle: session
image: swarmforge-docker-broker:latest
interface:
  kind: mcp
  transport: http
  port: 8080
  name: docker-broker
mounts:
  - docker-socket
readiness:
  mode: tcp
