name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  translate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make test
      # The harness install and image scripts only ever run inside `docker
      # build`, which CI does not do, so a syntax error in one would first be
      # seen by whoever next built an image. Each script is parsed by the
      # shell its shebang names; the tree holds both.
      - name: Check shell syntax
        run: |
          for script in install.sh anvil/entrypoint.sh swarmforge/harness/*/*.sh; do
            case "$(head -1 "$script")" in
              *bash) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: an unpinned linter turns a green branch red on someone else's
      # release. Raising the pin is a deliberate change with its own diff.
      - name: Install ruff
        run: pipx install ruff==0.16.1
      - name: Lint
        run: make lint

  docker-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tongs/docker-broker/package-lock.json
      - name: Install broker deps
        run: npm ci
        working-directory: tongs/docker-broker
      - name: Run broker unit tests
        run: npm test
        working-directory: tongs/docker-broker

  docker-broker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tongs/docker-broker/package-lock.json
      - name: Install broker deps
        run: npm ci
        working-directory: tongs/docker-broker
      - name: Pre-pull worker image
        run: docker pull alpine:3.20
      - name: Run broker end-to-end tests
        run: npm run test:e2e
        working-directory: tongs/docker-broker
