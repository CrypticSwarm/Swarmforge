name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  translate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: make test
      # These run only inside `docker build`, so nothing else here would catch a syntax error.
      - name: Check shell syntax
        run: |
          for script in install.sh anvil/entrypoint.sh swarmforge/harness/*/*.sh; do
            case "$(head -1 "$script")" in
              *bash) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: an unpinned linter turns a green branch red on someone else's release.
      - name: Install ruff
        run: pipx install ruff==0.16.1
      - name: Lint
        run: make lint

  docker-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tongs/docker-broker/package-lock.json
      - name: Install broker deps
        run: npm ci
        working-directory: tongs/docker-broker
      - name: Run broker unit tests
        run: npm test
        working-directory: tongs/docker-broker

  docker-broker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tongs/docker-broker/package-lock.json
      - name: Install broker deps
        run: npm ci
        working-directory: tongs/docker-broker
      - name: Pre-pull worker image
        run: docker pull alpine:3.20
      - name: Run broker end-to-end tests
        run: npm run test:e2e
        working-directory: tongs/docker-broker
